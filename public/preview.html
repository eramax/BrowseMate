<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>BrowseMate Preview</title>
    <style>
      :root { color-scheme: dark; --bg:#0b0e14; --surface:#121724; --border:#242c3d; --text:#eef2fb; --muted:#9aa4b8; --accent:#7c9cff; --err:#ff7b7b; --warn:#f5c451; }
      * { box-sizing: border-box; }
      html, body { margin:0; height:100%; background:var(--bg); color:var(--text); font:13px/1.4 system-ui, sans-serif; }
      .bar { display:flex; align-items:center; gap:8px; padding:8px 12px; background:var(--surface); border-bottom:1px solid var(--border); }
      .name { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-weight:600; }
      .status { font-size:11.5px; color:var(--muted); }
      .status.err { color:var(--err); }
      .status.warn { color:var(--warn); }
      .btn { border:1px solid var(--border); background:transparent; color:var(--text); border-radius:8px; padding:6px 10px; font-size:12px; cursor:pointer; }
      .btn:hover { background:#1a2132; }
      iframe { width:100%; height:calc(100% - 41px); border:0; background:#fff; }
      .hint { padding:10px; color:var(--muted); }
    </style>
  </head>
  <body>
    <div class="bar">
      <span class="name" id="name" dir="ltr">Preview</span>
      <span class="status" id="status">loading…</span>
      <button class="btn" id="reload">Reload</button>
      <button class="btn" id="download">Download</button>
    </div>
    <iframe id="frame" sandbox="allow-scripts allow-forms allow-modals allow-popups allow-popups-to-escape-sandbox allow-downloads"></iframe>
    <script src="preview/preview.js"></script>
  </body>
</html>
