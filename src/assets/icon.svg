<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 128 128" role="img" aria-label="BrowseMate assistant robot">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="0.55" stop-color="#16294A"/>
      <stop offset="1" stop-color="#0A1428"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.45" stop-color="#DCE6FA"/>
      <stop offset="1" stop-color="#9FB2D8"/>
    </linearGradient>
    <linearGradient id="visor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#050A14"/>
      <stop offset="1" stop-color="#0E1A30"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7C9CFF" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0.5"/>
    </linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- rounded app tile -->
  <rect x="2" y="2" width="124" height="124" rx="30" fill="url(#bg)"/>
  <rect x="3.5" y="3.5" width="121" height="121" rx="28.5" fill="none" stroke="url(#rim)" stroke-width="2" opacity="0.7"/>

  <!-- antenna -->
  <path d="M64 34V21" stroke="#7C9CFF" stroke-width="6" stroke-linecap="round"/>
  <circle cx="64" cy="16" r="6.5" fill="#22D3EE" filter="url(#glow)"/>

  <!-- ears -->
  <rect x="13" y="55" width="11" height="27" rx="5.5" fill="#263A5F" stroke="#4C6494" stroke-width="2"/>
  <rect x="104" y="55" width="11" height="27" rx="5.5" fill="#263A5F" stroke="#4C6494" stroke-width="2"/>

  <!-- assistant head -->
  <rect x="23" y="34" width="82" height="69" rx="24" fill="url(#metal)" stroke="#E7EEFF" stroke-width="2.5"/>
  <path d="M35 43C45 37 83 37 93 43" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.45"/>

  <!-- visor -->
  <rect x="33" y="49" width="62" height="34" rx="15" fill="url(#visor)" stroke="#2D4268" stroke-width="2"/>

  <!-- eyes -->
  <circle cx="51" cy="65" r="7" fill="#22D3EE" filter="url(#glow)"/>
  <circle cx="77" cy="65" r="7" fill="#22D3EE" filter="url(#glow)"/>
  <circle cx="49.5" cy="63" r="2" fill="#E8FFFF" opacity="0.9"/>
  <circle cx="75.5" cy="63" r="2" fill="#E8FFFF" opacity="0.9"/>

  <!-- friendly mouth -->
  <path d="M53 92C58 96 70 96 75 92" stroke="#8CA6FF" stroke-width="4" stroke-linecap="round" fill="none"/>
</svg>
