<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>sandbox</title>
    <style>html,body{margin:0;height:100%}iframe{width:100%;height:100%;border:0}</style>
  </head>
  <body>
    <iframe id="f" sandbox="allow-scripts allow-forms allow-modals allow-popups allow-downloads"></iframe>
    <script>
      (function () {
        'use strict';
        var f = document.getElementById('f');
        parent.postMessage({ __bmSandboxReady: true }, '*');
        window.addEventListener('message', function (e) {
          var d = e.data;
          if (!d) return;
          // تمرير سجلات الموقع (من الإطار الداخلي) إلى صفحة الإضافة
          if (d.__bmLog || d.__bmSandboxError) { parent.postMessage(d, '*'); return; }
          if (d.__bmRender && typeof d.html === 'string') {
            f.srcdoc = d.html;
          }
        });
      })();
    </script>
  </body>
</html>
